[project]
name = "ieee-iiitd-backend"
version = "1.0.0"
description = "API and content management for the IEEE IIIT Delhi student branch website"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.5",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "bleach>=6.2",
    "markdown-it-py>=3.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.14",
]

[project.scripts]
# Scriptable content management - see `just content-import` / `just admin`.
ieee-content = "app.content.cli:main"
ieee-admin = "app.cli.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
