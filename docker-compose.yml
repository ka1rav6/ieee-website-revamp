# Local development: Postgres only. The app itself runs on the host via
# `just dev` so you get instant reload. For the full containerised stack
# (what production runs) use `just run`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ieee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ieee-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-ieee}
    # Published on the loopback interface only: the host's tools can reach the
    # database, the network cannot. Docker's published ports bypass most host
    # firewalls, so "0.0.0.0" here would put Postgres on the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ieee} -d ${POSTGRES_DB:-ieee}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
